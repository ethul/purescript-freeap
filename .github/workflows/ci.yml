name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: "22"

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "unstable"
          spago: "1.0.5"

      - name: Install dependencies
        run: npm install

      - name: Build source
        run: npm run-script build

      - name: Run tests
        run: npm run-script test --if-present
