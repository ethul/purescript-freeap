  test:
    main: Test.Main
    dependencies:
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - exceptions: ">=6.0.0 <7.0.0"
      - integers: ">=6.0.0 <7.0.0"
      - maybe: ">=6.0.0 <7.0.0"
      - quickcheck: ">=8.0.0 <9.0.0"
      - quickcheck-laws: ">=7.0.0 <8.0.0"
